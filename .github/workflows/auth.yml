name: Standalone checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only
          MYSQL_DATABASE: swimlog_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -psynthetic-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cmolnar65/swim-log-evaluation
          ref: 91ed4d3a8070fcb56b09cd3b0bae41a3fe29896d
          path: plugin-reference
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli, openssl
          tools: wp-cli
          coverage: none
      - name: Lint
        run: |
          set -e
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find app public companion config tests -name '*.php' -print0)
          for script in scripts/*.sh; do bash -n "$script"; done
          php tests/release-loader.php
      - name: Fresh synthetic WordPress integration
        env:
          SWIMLOG_SYNTHETIC_TEST: '1'
        run: |
          mkdir /tmp/swimlog-wp
          wp core download --path=/tmp/swimlog-wp --version=latest
          wp config create --path=/tmp/swimlog-wp --dbname=swimlog_test --dbuser=root --dbpass=synthetic-only --dbhost=127.0.0.1
          wp core install --path=/tmp/swimlog-wp --url=https://wordpress.example.test --title=Synthetic --admin_user=synthetic_admin --admin_password=synthetic-only --admin_email=admin@example.test --skip-email
          wp eval-file "$GITHUB_WORKSPACE/tests/integration.php" --path=/tmp/swimlog-wp
      - name: HTTP login, callback, home and logout boundaries
        env:
          SWIMLOG_SYNTHETIC_TEST: '1'
          SWIMLOG_TEST_WP: /tmp/swimlog-wp
          SWIMLOG_CONFIG: /tmp/swimlog-config.php
          SWIMLOG_WEB_FIXTURE: /tmp/swimlog-web.json
        run: |
          if [ ! -d /tmp/swimlog-wp/wp-content/plugins/swimlog-core ]; then
            cp -a plugin-reference /tmp/swimlog-wp/wp-content/plugins/swimlog-core
            wp plugin activate swimlog-core --path=/tmp/swimlog-wp
            wp eval-file "$GITHUB_WORKSPACE/tests/calendar-fixture.php" --path=/tmp/swimlog-wp
          fi
          wp eval-file "$GITHUB_WORKSPACE/tests/web-fixture.php" --path=/tmp/swimlog-wp
          wp eval-file "$GITHUB_WORKSPACE/tests/calendar-integration.php" --path=/tmp/swimlog-wp
          printf '%s\n' "<?php return ['wordpress_load'=>'/tmp/swimlog-wp/wp-load.php','wordpress_origin'=>'https://wordpress.example.test','app_origin'=>'https://swimlog.example.test'];" > /tmp/swimlog-config.php
          mkdir -p /tmp/swimlog-wp/wp-content/mu-plugins
          python3 -c 'import os,pathlib; source=pathlib.Path("companion/loader.php").read_text(); pathlib.Path("/tmp/swimlog-wp/wp-content/mu-plugins/standalone.php").write_text(source.replace("/var/www/swimlog.cmolnar.com/current", os.environ["GITHUB_WORKSPACE"]))'
          php -S 127.0.0.1:8099 tests/router.php > /tmp/swimlog-http.log 2>&1 &
          server=$!
          trap 'kill "$server"; rm -f /tmp/swimlog-web.json' EXIT
          for attempt in {1..20}; do
            if curl -s -H 'Host: swimlog.example.test' http://127.0.0.1:8099/ > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/web.py
          if [ '${{ matrix.php }}' = '8.3' ]; then
            npm install --no-save --no-package-lock playwright@1.62.1
            npx playwright install --with-deps chromium firefox webkit
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=example.test' -addext 'subjectAltName=DNS:wordpress.example.test,DNS:swimlog.example.test' -keyout /tmp/swimlog-key.pem -out /tmp/swimlog-cert.pem > /dev/null 2>&1
            env SWIMLOG_SYNTHETIC_TEST=1 python3 "$GITHUB_WORKSPACE/tests/tls-proxy.py" > /tmp/swimlog-tls.log 2>&1 &
            tls=$!
            trap 'kill "$server"; kill "$tls" || true; rm -f /tmp/swimlog-web.json /tmp/swimlog-key.pem /tmp/swimlog-cert.pem' EXIT
            for attempt in {1..20}; do
              if curl --noproxy '' -x http://127.0.0.1:8088 -ks https://swimlog.example.test/ > /dev/null; then break; fi
              sleep 1
            done
            if ! curl --noproxy '' -x http://127.0.0.1:8088 -ks https://swimlog.example.test/ > /dev/null; then
              cat /tmp/swimlog-tls.log
              exit 1
            fi
            for browser in chromium firefox webkit; do
              wp eval-file "$GITHUB_WORKSPACE/tests/web-fixture.php" --path=/tmp/swimlog-wp
              SWIMLOG_BROWSER="$browser" node tests/browser.cjs
            done
          fi
